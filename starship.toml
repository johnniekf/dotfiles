# ─────────────────────────────────────────────
#  starship.toml — Catppuccin Frappé
#  Place at: ~/.config/starship.toml
# ─────────────────────────────────────────────

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](overlay0) $os$username $directory$git_branch$git_status$cmd_duration
[╰─](overlay0)$character """

# Pallete
palette = "catppuccin_frappe"

[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo  = "#eebebe"
pink      = "#f4b8e4"
mauve     = "#ca9ee6"
red       = "#e78284"
maroon    = "#ea999c"
peach     = "#ef9f76"
yellow    = "#e5c890"
green     = "#a6d189"
teal      = "#81c8be"
sky       = "#99d1db"
sapphire  = "#85c1dc"
blue      = "#8caaee"
lavender  = "#babbf1"
text      = "#c6d0f5"
subtext1  = "#b5bfe2"
subtext0  = "#a5adce"
overlay2  = "#949cbb"
overlay1  = "#838ba7"
overlay0  = "#737994"
surface2  = "#626880"
surface1  = "#51576d"
surface0  = "#414559"
base      = "#303446"
mantle    = "#292c3c"
crust     = "#232634"

[os]
disabled = false
style    = "bold mauve"

[os.symbols]
Macos = " "
Linux = " "
Ubuntu = " "
Arch = " "
Debian = " "
Fedora = " "

[username]
show_always = true
style_user  = "bold blue"
style_root  = "bold red"
format      = "[$user]($style) "

[directory]
style            = "bold lavender"
read_only        = " 󰌾"
truncation_length = 4
truncate_to_repo  = true
format           = "[$path]($style)[$read_only](red) "

[git_branch]
symbol = " "
style  = "bold green"
format = "on [$symbol$branch]($style) "

[git_status]
style   = "bold yellow"
format  = "([$all_status$ahead_behind]($style) )"
ahead   = "⇡${count}"
behind  = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "󰩌 "
untracked  = "? "
modified   = "! "
staged     = "+ "
deleted    = "✘ "

[cmd_duration]
min_time = 2000
style    = "bold peach"
format   = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold mauve)"

[nodejs]
symbol = " "
style  = "bold green"

[python]
symbol = " "
style  = "bold yellow"

[rust]
symbol = " "
style  = "bold peach"

[golang]
symbol = " "
style  = "bold sky"

[docker_context]
symbol = " "
style  = "bold blue"

[package]
disabled = true

[line_break]
disabled = false
